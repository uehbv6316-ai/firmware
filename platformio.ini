[env:my-esp32]
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/my-esp32>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/my-esp32

	; ==================== Feature gates ====================
	-DHAS_6_BUTTONS  ; Up/Down/Left/Right/Select/Esc, all physical

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MISO=-1
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=27
	-DTFT_DC=26
	-DTFT_RST=25
	-DTFT_BL=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=-1

	; ==================== Environment Flags ====================
	-DBTN_ALIAS='"OK"'
	-DFP=1
	-DFM=1
	-DFG=2
	-DROTATION=0
	-DDEVICE_NAME='"My ESP32 OS"'

; This is the ONE line that undoes Bruce's own 4MB space-saving choice to
; drop the music library -- it keeps ESP8266Audio even though env_4mb's
; lib_ignore would otherwise remove it.
lib_deps =
	${env.lib_deps}
	ESP8266Audio@^2.4.1

lib_ignore =
